name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip project.zip -d ./project_folder
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant Permission
      working-directory: ./project_folder
      run: chmod +x gradlew
    - name: Build APK
      working-directory: ./project_folder
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project_folder/app/build/outputs/apk/debug/app-debug.apk
